name: Android APK

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (no obsolete 'tools' package)
        uses: android-actions/setup-android@v3
        with:
          # Ensure API level matches android/app/build.gradle.kts (compileSdk = 34)
          api-level: 34
          # Explicit, valid sdkmanager packages only — do NOT include 'tools'
          components: |
            platform-tools
            build-tools;34.0.0
            platforms;android-34

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: float-translate-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
